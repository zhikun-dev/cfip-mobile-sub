name: Update Cloudflare mobile preferred domains

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate feed
        run: python update.py

      - name: Commit only when the active feed changed
        run: |
          if git diff --quiet -- cf-mobile.txt; then
            echo 'No feed change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cf-mobile.txt
          git commit -m 'chore: refresh mobile CF domains'
          git push
